appId: nl.amsterdam.app.dev
---
- runFlow:
    file: ../../shared/open-module-from-fresh-app.yaml
    env:
      ENVIRONMENT: Acceptance
      MODULE: HomeConstructionWorkModuleButton
- runFlow:
    file: ../shared/open-test-project.yaml
- tapOn:
    id: ConstructionWorkProjectUnfollowButton
    optional: true
- tapOn:
    id: ConstructionWorkProjectFollowButton
- tapOn:
    text: 'Sta toe|Allow'
    optional: true
- tapOn:
    id: ConstructionWorkProjectUnfollowButton
- assertVisible:
    id: ConstructionWorkProjectFollowButton
# TODO: check project details zoals contact, over dit project en planning
- tapOn:
    id: 'ConstructionWorkProjectArticlePreviewButton'
- assertVisible:
    id: "ConstructionWorkProjectArticle\\d+Image"
- assertVisible:
    id: "ConstructionWorkProjectArticle\\d+DateLabel"
- assertVisible:
    id: "ConstructionWorkProjectArticle\\d+ProjectTitle"
- assertVisible:
    id: "ConstructionWorkProjectArticle\\d+Title"
- assertVisible:
    id: 'html'
# TODO: story maken voor wat moeten we met projecten zonder afbeelding?
# TODO: moet nog de volgorde van projecten op afstand (adres of gps) getest worden?
# TODO: checken of bij het invoeren van een adres ook een afstand tot het project staat
