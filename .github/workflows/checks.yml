name: Validation Checks
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-node

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run Formatter
        run: npm run format
